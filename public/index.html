<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HR Recruiter Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-mark">HR</span>
          <span class="brand-name">HR Recruiter</span>
        </div>
        <nav class="topbar-nav">
          <span class="nav-item active">Dashboard</span>
        </nav>
      </div>
    </header>

    <main class="page">
      <section class="hero">
        <div>
          <p class="eyebrow">Workforce insights</p>
          <h1>Employee overview</h1>
          <p class="subtitle">A real-time view of headcount, hiring activity, and department distribution.</p>
        </div>
      </section>

      <section class="summary-grid" id="summary-grid"></section>

      <section class="panel">
        <div class="panel-header">
          <h2>Employee records</h2>
          <div class="controls">
            <label>
              Search
              <input id="search" type="search" placeholder="Search by name or department" />
            </label>
            <label>
              Department
              <select id="departmentFilter">
                <option value="all">All departments</option>
              </select>
            </label>
            <label>
              Status
              <select id="statusFilter">
                <option value="all">All</option>
                <option value="active">Active</option>
                <option value="voluntarily terminated">Voluntarily Terminated</option>
                <option value="terminated for cause">Terminated for Cause</option>
              </select>
            </label>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Job Title</th>
                <th>Department</th>
                <th>Status</th>
                <th>Date of Hire</th>
                <th>Date of Termination</th>
                <th>Source</th>
              </tr>
            </thead>
            <tbody id="employee-table-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
